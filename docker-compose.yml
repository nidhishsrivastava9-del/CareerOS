# ==============================================================================
# CareerOS — Production Multi-Container Docker Compose (Day 12)
# Orchestrates Frontend (Nginx), Backend REST API (Node.js LTS), and MongoDB
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # CareerOS Frontend Single Page Application (Nginx Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careeros-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - careeros-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # CareerOS Backend REST API (Node.js 20 LTS Alpine)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/careeros}
      - JWT_SECRET=${JWT_SECRET:-careeros_secure_production_secret_key_change_in_env}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - AI_API_KEY=${AI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=600
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - careeros-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # MongoDB Database (Local Production / Staging Instance)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: careeros-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - careeros-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  careeros-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
